# Local dev only (see docs/deploy.md, added in Phase 4, for per-country
# deployment). This file is unverified on this machine — Docker isn't
# installed here; the tenancy core was built and tested against native
# Postgres 17 + Memurai instead (see docs/decisions.md). Review before first
# use: `docker compose config` then `docker compose up`.
name: opsyra

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-opsyra_us}
      DB_USERNAME: ${DB_USERNAME:-opsyra}
      DB_PASSWORD: ${DB_PASSWORD:-opsyra_local_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy

  pgsql:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      APP_DB_USER: ${DB_USERNAME:-opsyra}
      APP_DB_PASSWORD: ${DB_PASSWORD:-opsyra_local_dev}
      APP_DB_NAME: ${DB_DATABASE:-opsyra_us}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - opsyra-pgsql-data:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - opsyra-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  opsyra-pgsql-data:
    driver: local
  opsyra-redis-data:
    driver: local
